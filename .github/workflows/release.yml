# Activated 2026-05-07 — repo published to
# `github.com/lordmacu/nexo-plugin-browser` (Phase 81.17.c
# follow-up `81.17.c.publish-github`).
#
# Tag push (`v0.2.0`, `v0.2.1`, …) builds release binaries for
# linux-x64 + macos-arm64 and creates a GitHub Release with the
# assets attached. Operators install via
# `curl -L <release-url>/nexo-plugin-browser-<target>.tar.gz`.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: nexo-plugin-browser
      # Path deps in Cargo.toml resolve `../proyecto/crates/...`
      # — fetch the daemon workspace alongside the plugin so
      # cargo can build until 81.17.c.crates-publish ships.
      - name: Checkout proyecto (path-dep workspace)
        uses: actions/checkout@v4
        with:
          repository: lordmacu/nexo-rs
          path: proyecto
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo build --release
        working-directory: nexo-plugin-browser
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        working-directory: nexo-plugin-browser
        run: |
          mkdir -p dist
          tar czf dist/nexo-plugin-browser-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            nexo-plugin-browser
          tar czf dist/manifest-${{ matrix.target }}.tar.gz nexo-plugin.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: nexo-plugin-browser/dist/

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true
