# Phase 81.17.c — out-of-tree standalone repo.
#
# Built as a binary subprocess plugin loaded by the nexo-rs daemon
# via discovery + auto-subprocess fallback (Phase 81.17 + 81.17.b).
# The daemon spawns this binary, JSON-RPC handshakes over stdio,
# and routes `tool.invoke` requests for the 12 `browser_*` tools
# through the SDK's `on_tool` dispatcher.
#
# Path deps to `../proyecto/crates/...` are interim — they ship
# this repo today before nexo-microapp-sdk + nexo-config + the
# rest publish to crates.io. Operators outside the monorepo build
# the binary against published crates.io versions; the
# `Cargo.lock` (committed; binary repo convention) pins the
# resolved versions for reproducibility.
[package]
name        = "nexo-plugin-browser"
version     = "0.2.0"
description = "Chrome DevTools Protocol (CDP) browser plugin for Nexo agents (out-of-tree subprocess)."
edition     = "2021"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/lordmacu/nexo-plugin-browser"
authors     = ["Cristian García <informacion@cristiangarcia.co>"]
readme      = "README.md"
keywords    = ["nexo", "plugin", "browser", "cdp", "agent"]
categories  = ["api-bindings", "command-line-utilities"]
rust-version = "1.75"

[[bin]]
name = "nexo-plugin-browser"
path = "src/main.rs"

# Plain cargo bench harness — no criterion dep weight. The bench
# measures stdio round-trip latency of `tool.invoke` against a
# spawned binary. Run with `cargo bench --bench tool_latency`.
[[bench]]
name = "tool_latency"
path = "benches/tool_latency.rs"
harness = false

[dependencies]
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
anyhow            = "1"
thiserror         = "1"
tracing           = "0.1"
async-trait       = "0.1"
dashmap           = "6"
tokio-tungstenite = "0.24"
tokio-util        = "0.7"
base64            = "0.22"
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures           = "0.3"
uuid              = { version = "1", features = ["serde", "v4"] }

# nexo-* deps as dual `version + path` so the repo:
#   - builds in CI alongside a `proyecto/` sibling checkout
#     (path resolves first when present);
#   - resolves from crates.io once published versions advance to
#     match the in-tree shape (currently nexo-core 0.1.1 on
#     crates.io is incompatible with nexo-mcp 0.1.2 — full
#     cascade publish is Phase 83.14.b territory).
#
# Already-published in 81.17.c.crates-publish:
#   - nexo-cdp v0.1.0
#   - nexo-microapp-sdk v0.1.1
nexo-microapp-sdk    = { version = "0.1.1", path = "../proyecto/crates/microapp-sdk", features = ["plugin"] }
nexo-broker          = { version = "0.1.2", path = "../proyecto/crates/broker" }
nexo-cdp             = { version = "0.1.0", path = "../proyecto/crates/cdp" }
nexo-config          = { version = "0.1.4", path = "../proyecto/crates/config" }
nexo-core            = { version = "0.1.1", path = "../proyecto/crates/core" }
nexo-llm             = { version = "0.1.2", path = "../proyecto/crates/llm" }
nexo-resilience      = { version = "0.1.1", path = "../proyecto/crates/resilience" }
nexo-plugin-manifest = { version = "0.1.0", path = "../proyecto/crates/plugin-manifest" }

# toml: the copied plugin.rs uses `toml::from_str` to parse the
# bundled manifest.
toml = "0.8"

[dev-dependencies]
libc       = "0.2"
assert_cmd = "2"
serial_test = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

# Iterative release builds — full opt, no LTO, parallel codegen.
# Costs ~5 % runtime; saves ~50 % build time. Reserve `--release`
# for publish.
[profile.release-fast]
inherits      = "release"
lto           = false
codegen-units = 16
strip         = "none"
